{% extends 'base.html' %}

{% block content %}
<div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px;">
    <a href="{{ url_for('tabungan') }}"
        style="color: #000000; text-decoration: none; font-size: 1.2rem; display: flex; align-items: center; gap: 6px; font-weight: 600;">
        <i class="bi bi-arrow-left"></i> Kembali
    </a>
    <h3 style="margin: 0; font-size: 1.1rem;">Tambah Tabungan</h3>
    <div style="width: 60px;"></div>
</div>

{% with messages = get_flashed_messages(with_categories=true) %}
{% if messages %}
<div class="flash-stack">
    {% for category, message in messages %}
    <div class="auth-alert {% if category == 'danger' %}alert-danger{% else %}alert-success{% endif %}">{{ message }}</div>
    {% endfor %}
</div>
{% endif %}
{% endwith %}

<div class="form-card">
    <form action="{{ url_for('tambah_tabungan') }}" method="POST">
        <input type="hidden" name="warna" value="#1c1c1e">

        <div class="form-group">
            <label for="nama">Nama tabungan</label>
            <input type="text" id="nama" name="nama" maxlength="100" placeholder="Contoh: Monitor gaming" required>
        </div>

        <div class="savings-form-grid">
            <div class="form-group">
                <label for="target_nominal">Target (Rp) <span class="optional-label">opsional</span></label>
                <input type="number" id="target_nominal" name="target_nominal" min="1" step="1" placeholder="Contoh: 10000000">
            </div>
            <div class="form-group">
                <label for="deadline">Deadline <span class="optional-label">opsional</span></label>
                <input type="date" id="deadline" name="deadline">
            </div>
        </div>

        <div class="form-group">
            <label for="product_url">Tautan produk (opsional)</label>
            <input type="url" id="product_url" name="product_url" maxlength="2000" placeholder="Tempel tautan Tokopedia, Shopee, dll">
        </div>

        <div id="linkPreview" class="product-preview" hidden>
            <img id="previewImage" alt="Preview produk">
            <div class="product-preview-copy">
                <span id="previewSite"></span>
                <strong id="previewTitle"></strong>
                <em id="previewStatus">Mengambil preview...</em>
            </div>
        </div>

        <button type="submit" class="btn-submit btn-primary" style="cursor: pointer; width: 100%; margin-top: 10px;">
            Buat Tabungan
        </button>
    </form>
</div>

<script>
    const productInput = document.getElementById('product_url');
    const previewBox = document.getElementById('linkPreview');
    const previewImage = document.getElementById('previewImage');
    const previewTitle = document.getElementById('previewTitle');
    const previewSite = document.getElementById('previewSite');
    const previewStatus = document.getElementById('previewStatus');
    const namaInput = document.getElementById('nama');
    let previewTimer = null;
    let lastPreviewUrl = '';

    function tampilkanPreview(data, loading) {
        previewBox.hidden = false;
        previewTitle.textContent = data.title || 'Preview tautan';
        previewSite.textContent = data.site || '';
        previewStatus.textContent = loading ? 'Mengambil preview...' : '';
        if (data.image) {
            previewImage.hidden = false;
            previewImage.src = data.image;
        } else {
            previewImage.removeAttribute('src');
            previewImage.hidden = !loading;
        }
    }

    function resetPreview() {
        previewBox.hidden = true;
        previewImage.removeAttribute('src');
        previewTitle.textContent = '';
        previewSite.textContent = '';
        previewStatus.textContent = '';
        lastPreviewUrl = '';
    }

    productInput.addEventListener('input', () => {
        const url = productInput.value.trim();
        clearTimeout(previewTimer);
        if (!url) {
            resetPreview();
            return;
        }
        tampilkanPreview({ title: 'Mengambil data produk', site: '' }, true);
        previewTimer = setTimeout(async () => {
            try {
                const response = await fetch(`/api/preview-tautan?url=${encodeURIComponent(url)}`);
                const data = await response.json();
                if (!data.success) {
                    tampilkanPreview({ title: 'Preview belum tersedia', site: 'Tautan tetap bisa disimpan' }, false);
                    return;
                }
                lastPreviewUrl = data.url;
                tampilkanPreview(data, false);
                if (!namaInput.value.trim() && data.title) {
                    namaInput.value = data.title.slice(0, 100);
                }
            } catch (error) {
                tampilkanPreview({ title: 'Preview belum tersedia', site: 'Tautan tetap bisa disimpan' }, false);
            }
        }, 600);
    });

</script>
{% endblock %}
